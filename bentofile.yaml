service: "xray.ml.model.model_service:XRayService"
labels:
  owner: ansh
  stage: dev
docker:
  python_version: "3.12"
include:
  - "xray/ml/model/*"
  - "xray/constant/training_pipeline/__init__.py"
models:
  - "xray_model:latest"
python:
  packages:
    - bentoml==1.4.39
    - setuptools<81
    - importlib-metadata>=6.0,<7.0
    - torch==2.9.0
    - torchvision==0.24.0
    - Pillow==12.3.0
    - numpy==2.2.6
